# Builds the static site and publishes it to GitHub Pages (jeevanto.com). No secrets: the site holds none.
name: Deploy jeevanto.com
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx astro build
        env:
          # The build reads ENGINES' public settings door; set the repository variable SITE_CONFIG_DOOR=off to build from site-config.json alone.
          SITE_CONFIG_DOOR: ${{ vars.SITE_CONFIG_DOOR }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
